name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Lint: ruff check + format (fast, no ML deps needed)
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: pip install ruff

      - name: ruff check
        run: ruff check .

      - name: ruff format check
        run: ruff format --check .

  # ---------------------------------------------------------------------------
  # Security: scan pinned dependencies for known CVEs
  # ---------------------------------------------------------------------------
  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit requirements
        # --ignore-vuln for known false-positives can be added here if needed
        run: pip-audit -r requirements.txt --skip-editable
        continue-on-error: true   # informational until pinned deps are updated

  # ---------------------------------------------------------------------------
  # Unit tests: lightweight deps only (rdkit, numpy, pandas, pytest)
  # Integration tests (require model files) are NOT run in CI.
  # ---------------------------------------------------------------------------
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip wheels
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-unit-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-unit-

      - name: Install unit-test dependencies
        run: |
          pip install pytest pytest-cov
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install rdkit numpy pandas

      - name: Run unit tests (excluding integration)
        run: pytest tests/unit/ -v --tb=short -m "not integration"
