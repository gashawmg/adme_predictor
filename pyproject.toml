[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adme-predictor"
version = "0.1.0"
description = "ADMET property predictor for drug-like molecules using MPNN and ensemble ML models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gashaw Mekuria" }]
keywords = ["admet", "drug-discovery", "cheminformatics", "mpnn", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "chemprop==2.2.1",
    "rdkit",
    "torch",
    "lightning",
    "pytorch-lightning",
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "xgboost",
    "lightgbm",
    "catboost",
    # altair pinned to 4.2.2 for compatibility with streamlit <1.33
    # upgrade both together when moving to streamlit >=1.33
    "streamlit>=1.29,<1.33",
    "altair==4.2.2",
    "pillow",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff>=0.4",
    "mypy>=1.9",
    "pip-audit",
    "pre-commit",
]

[project.urls]
Repository = "https://github.com/gashawmg/adme_predictor"
"Live App" = "https://admepredictor.streamlit.app/"

# =============================================================================
# Ruff (linter + formatter)
# =============================================================================
[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["trained_models/", ".devcontainer/", "scripts/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
# E501 line-too-long: ignored because config dicts (model_config.py, settings.py)
# have long lines that are intentionally readable as tables
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# consolidate_models.py uses print() — acceptable for a CLI helper script
"consolidate_models.py" = ["T201"]

# =============================================================================
# Mypy (type checker)
# =============================================================================
[tool.mypy]
python_version = "3.11"
# chemprop, rdkit, lightgbm, xgboost, catboost ship incomplete stubs
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
# Streamlit decorators confuse mypy
disable_error_code = ["misc"]

# =============================================================================
# Pytest
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
markers = [
    "integration: requires trained model files in trained_models/ (skip in CI)",
]

# =============================================================================
# Hatch build (exclude non-distributable artifacts)
# =============================================================================
[tool.hatch.build.targets.wheel]
exclude = [
    "trained_models/",
    "tests/",
    ".github/",
    ".devcontainer/",
    "scripts/",
]
